<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame browser — declassified imagery</title>
<link href="vendor/maplibre-gl.css" rel="stylesheet">
<script src="vendor/maplibre-gl.js"></script>
<style>
  :root{--bg:#0b0e13;--panel:#11161e;--edge:#2a3441;--ink:#e6edf3;--dim:#8b98a9;
        --hi:#f0b429;--un:#a78bfa;--chip:#1a2029}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
            font:13px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}

  /* top bar */
  #bar{display:flex;gap:8px;align-items:center;padding:9px 12px;flex-wrap:wrap;
       border-bottom:1px solid var(--edge);background:#0d1118}
  #brand{font-weight:600;white-space:nowrap}
  #brand span{color:var(--dim);font-weight:400;margin-left:7px;font-size:11.5px}
  .ctl{background:var(--chip);border:1px solid var(--edge);color:var(--ink);
       border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
  .ctl:hover{border-color:#3d4b5c}
  .ctl:disabled{opacity:.4;cursor:default}
  .ctl.on{border-color:#f0b42955;color:var(--hi);background:#f0b4290d}
  #eid{flex:1;min-width:230px;max-width:340px;cursor:text;
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .spacer{flex:1}
  a.ctl{text-decoration:none;display:inline-block}

  /* main split */
  #main{flex:1;display:flex;min-height:0}
  #stage{flex:1;display:flex;flex-direction:column;min-width:0;background:#080b0f}
  #stage-top{flex:1;position:relative;min-height:0;display:flex;align-items:center;
             justify-content:center;overflow:hidden}
  #stage-top.zoomed{cursor:grab}
  #stage-top.grabbing{cursor:grabbing}
  #shot{max-width:100%;max-height:100%;object-fit:contain;display:none;
        transform-origin:center center;will-change:transform;touch-action:none;
        -webkit-user-select:none;user-select:none;-webkit-user-drag:none}
  #shot.show{display:block}
  #shot-msg{position:absolute;color:var(--dim);font-size:13px;text-align:center;padding:20px}
  /* zoom controls, bottom-left of the image */
  #zoomctl{position:absolute;left:10px;bottom:10px;z-index:3;display:flex;gap:4px;
           align-items:center;opacity:0;transition:opacity .15s;pointer-events:none}
  #stage-top:hover #zoomctl,#stage-top.zoomed #zoomctl{opacity:1;pointer-events:auto}
  #zoomctl button{width:26px;height:26px;padding:0;font-size:15px;line-height:1;
                  background:#11161ee6;border:1px solid var(--edge);color:var(--ink);
                  border-radius:6px;cursor:pointer}
  #zoomctl button:hover{border-color:#3d4b5c}
  #zoomctl #zoomlvl{font-size:11px;color:var(--dim);background:#11161ee6;
                    border:1px solid var(--edge);border-radius:6px;padding:0 8px;height:26px;
                    display:flex;align-items:center;font-variant-numeric:tabular-nums;min-width:44px;
                    justify-content:center}
  #zoomctl .hint{font-size:10.5px;color:#5c6773;margin-left:4px}
  #meta{border-top:1px solid var(--edge);padding:10px 14px;background:#0d1118;
        display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  #meta .k{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
  #meta .v{font-size:12.5px;margin-top:1px}
  #meta .v.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--hi)}

  /* filmstrip */
  #strip{height:96px;border-top:1px solid var(--edge);background:#0d1118;
         display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;padding:8px 10px;
         scrollbar-width:thin}
  /* No thumbnails here: USGS only offers a 65px-wide thumbnail, and these
     frames are ~16:1 panoramic, so it comes back 65x4 — a sliver. The only
     real preview is the browse image at ~5MB, far too heavy to tile. So the
     rail carries the information instead. */
  .cell{flex:0 0 auto;width:92px;height:78px;border:1px solid var(--edge);border-radius:5px;
        background:#0b0e13;cursor:pointer;position:relative;overflow:hidden;
        display:flex;flex-direction:column;justify-content:center;gap:3px;padding:6px 7px}
  .cell:hover{border-color:#3d4b5c;background:#141a23}
  .cell.on{border-color:var(--hi);background:#f0b4290f}
  .cell .n{font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .cell.on .n{color:var(--hi)}
  .cell .d{font-size:9.5px;color:var(--dim)}
  .cell .c{font-size:9px;color:#5c6773;
           font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell.un{border-style:dashed}
  .cell.un .n{color:var(--un)}

  /* side list */
  #side{width:340px;border-left:1px solid var(--edge);background:#0d1118;
        display:flex;flex-direction:column;min-height:0}
  #fbar{padding:9px 14px;border-bottom:1px solid var(--edge);
        display:flex;flex-direction:column;gap:8px}
  #cam-chips{display:flex;flex-wrap:wrap;gap:5px}
  .fchip{background:#0b0e13;border:1px solid var(--edge);color:var(--dim);
         border-radius:5px;font:inherit;font-size:11px;padding:3px 8px;cursor:pointer}
  .fchip:hover{border-color:#3d4b5c}
  .fchip.on{color:var(--ink);border-color:#6c5ce7;background:#6c5ce71a}
  #unsc-lbl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);cursor:pointer}
  #minimap{height:150px;position:relative;background:#080b0f}
  #minimap canvas{cursor:default}
  #mini-cred{font-size:9px;color:#5c6773;padding:2px 14px;border-bottom:1px solid var(--edge);
             text-align:right}
  #side h2{margin:0;padding:11px 14px;font-size:12px;font-weight:600;
           border-bottom:1px solid var(--edge)}
  #side h2 small{display:block;color:var(--dim);font-weight:400;font-size:11px;margin-top:2px}
  #jump{padding:9px 14px;border-bottom:1px solid var(--edge);display:flex;gap:6px}
  #jump input{flex:1;min-width:0}
  #list{overflow-y:auto;flex:1}
  .row{padding:7px 14px;border-bottom:1px solid #161c25;cursor:pointer;display:flex;gap:8px}
  .row:hover{background:#141a23}
  .row.on{background:#1a2130}
  .row .i{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;flex:1;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .p{color:var(--dim);font-size:10.5px;font-variant-numeric:tabular-nums}
  .row.un .i{color:var(--un)}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9;
         background:#1f2937;border:1px solid var(--edge);border-radius:8px;padding:8px 14px;
         font-size:12px;display:none}
  kbd{background:#1a2029;border:1px solid var(--edge);border-radius:3px;padding:0 4px;
      font-size:10.5px;font-family:inherit;color:var(--dim)}
</style>
</head>
<body>
<div id="app">

<div id="bar">
  <div id="brand">Frame browser <span>flight order</span></div>
  <input class="ctl" id="eid" placeholder="Entity ID, e.g. D3C1214-300989A017" autocomplete="off" spellcheck="false">
  <button class="ctl" id="go">Open</button>
  <button class="ctl" id="prev" disabled>← Prev</button>
  <button class="ctl" id="next" disabled>Next →</button>
  <button class="ctl" id="lock" title="Keep the same zoom & position when stepping frames">🔒 Lock zoom</button>
  <div class="spacer"></div>
  <span style="color:var(--dim);font-size:11px">
    <kbd>←</kbd> <kbd>→</kbd> to step · scroll to zoom</span>
  <a class="ctl" id="ee" target="_blank" rel="noopener">EarthExplorer ↗</a>
  <a class="ctl" id="onmap" target="_blank" rel="noopener">Show on map ↗</a>
</div>

<div id="main">
  <div id="stage">
    <div id="stage-top">
      <div id="shot-msg">Enter an entity ID to start.</div>
      <img id="shot" alt="">
      <div id="zoomctl">
        <button id="z-out" title="Zoom out">−</button>
        <span id="zoomlvl">1.0×</span>
        <button id="z-in" title="Zoom in">+</button>
        <button id="z-fit" title="Fit to view">⤢</button>
        <span class="hint">scroll · drag · double-click to fit</span>
      </div>
    </div>
    <div id="meta"></div>
    <div id="strip"></div>
  </div>

  <aside id="side">
    <h2 id="side-title">No mission loaded<small id="side-sub">—</small></h2>
    <div id="fbar">
      <div id="cam-chips"></div>
      <label id="unsc-lbl"><input type="checkbox" id="unsc"> Show unscanned frames</label>
    </div>
    <div id="minimap"></div>
    <div id="mini-cred">© OpenStreetMap · © CARTO</div>
    <div id="jump">
      <input class="ctl" id="jump-n" type="number" min="1" placeholder="frame #">
      <button class="ctl" id="jump-go">Go</button>
    </div>
    <div id="list"></div>
  </aside>
</div>

</div>
<div id="toast"></div>

<script>
const el = id => document.getElementById(id);
const EE_IDS = {corona2:'5e839febdccb64b3', declassii:'5e839ff7d71d4811',
                declassiii:'5e7c41f3ffaaf662'};

// The mission is parsed out of the entity ID rather than looked up: it agrees
// with the archive's own mission field on all 213,952 frames, which means the
// browser can fetch one mission file directly instead of loading a 30MB index
// just to find out where to look.
const MISSION_PATS = [
  [/^D3C(\d{4})-/,     m => ['declassiii', m[1]]],
  [/^DZ[BC](\d{4})-/,  m => ['declassii',  m[1]]],
  [/^DZ[BC](\d{6})/,   m => ['declassii',  String(parseInt(m[1], 10))]],
  [/^DS(\d{4})-/,      m => ['corona2',    m[1]]],
  [/^DS(\d{5})A/,      m => ['corona2',    String(parseInt(m[1], 10)) + 'A']],
  [/^DS(\d{6})/,       m => ['corona2',    String(parseInt(m[1], 10))]],
];
function missionOf(entityId){
  const s = (entityId || '').trim().toUpperCase();
  for (const [rx, fn] of MISSION_PATS){
    const m = s.match(rx);
    if (m) return fn(m);
  }
  return null;
}

let cur = null;      // {mission, dataset, satellite, browsePrefix, frames:[...]}
let pos = -1;        // index into cur.frames
const cache = new Map();

// Browse images go through our own /img/ proxy, not straight to USGS. USGS
// sends them with nosniff and no CORS and 500s on some cross-origin patterns,
// so Chromium's ORB refuses to paint a direct <img>. The proxy re-serves them
// same-origin (and caches them at our edge). browsePrefix is the full USGS
// URL; keep only the path after the host.
const PROXY = '/img/';
const browseUrl = tail => {
  const p = (cur.browsePrefix + tail).replace(/^https?:\/\/[^/]+\//, '');
  return PROXY + p;
};

const F = {ID:0, DATE:1, BROWSE:2, CAM:3, SCANNED:4, LON:5, LAT:6};

// ── pan / zoom ──────────────────────────────────────────────────────────────
// The browse images are up to 29332px wide, so at fit-to-view you're seeing a
// ~20x downscale. Wheel zooms toward the cursor, drag pans, and with the frames
// being one long orbital strip, being able to move along it is the point.
const MAXZOOM = 24;
const view = {scale:1, tx:0, ty:0};     // transform applied to #shot
let keepZoom = false;                   // preserve view across next/prev
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function applyView(){
  const shot = el('shot'), top = el('stage-top');
  shot.style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.scale})`;
  top.classList.toggle('zoomed', view.scale > 1.001);
  el('zoomlvl').textContent = view.scale.toFixed(1) + '×';
}
function clampView(){
  const shot = el('shot');
  // Keep the container centre over the image, so it can't be flung off-screen.
  const mx = shot.offsetWidth  * view.scale / 2;
  const my = shot.offsetHeight * view.scale / 2;
  view.tx = clamp(view.tx, -mx, mx);
  view.ty = clamp(view.ty, -my, my);
}
function resetView(){ view.scale = 1; view.tx = 0; view.ty = 0; applyView(); }

// Zoom toward a screen point, holding whatever is under it fixed. Origin is the
// element centre, so d is the cursor offset from that centre.
function zoomAt(clientX, clientY, factor){
  const shot = el('shot');
  if (!shot.classList.contains('show')) return;
  const rect = el('stage-top').getBoundingClientRect();
  const dx = clientX - (rect.left + rect.width  / 2);
  const dy = clientY - (rect.top  + rect.height / 2);
  const ns = clamp(view.scale * factor, 1, MAXZOOM);
  const r = ns / view.scale;
  view.tx = dx - r * (dx - view.tx);
  view.ty = dy - r * (dy - view.ty);
  view.scale = ns;
  if (view.scale <= 1.001){ view.tx = 0; view.ty = 0; }   // snap back to centred
  clampView(); applyView();
}

(function initPanZoom(){
  const top = el('stage-top');
  top.addEventListener('wheel', e => {
    if (!el('shot').classList.contains('show')) return;
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0016));
  }, {passive:false});

  let panning = false, px = 0, py = 0;
  top.addEventListener('pointerdown', e => {
    if (view.scale <= 1.001 || !el('shot').classList.contains('show')) return;
    panning = true; px = e.clientX; py = e.clientY;
    top.setPointerCapture(e.pointerId); top.classList.add('grabbing');
  });
  top.addEventListener('pointermove', e => {
    if (!panning) return;
    view.tx += e.clientX - px; view.ty += e.clientY - py;
    px = e.clientX; py = e.clientY;
    clampView(); applyView();
  });
  const endPan = () => { panning = false; top.classList.remove('grabbing'); };
  top.addEventListener('pointerup', endPan);
  top.addEventListener('pointercancel', endPan);

  top.addEventListener('dblclick', e => {
    if (view.scale > 1.001) resetView();
    else zoomAt(e.clientX, e.clientY, 4);
  });

  const centre = () => {
    const r = el('stage-top').getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  };
  el('z-in').addEventListener('click',  () => zoomAt(...centre(), 1.5));
  el('z-out').addEventListener('click', () => zoomAt(...centre(), 1 / 1.5));
  el('z-fit').addEventListener('click', resetView);

  el('lock').addEventListener('click', () => {
    keepZoom = !keepZoom;
    el('lock').classList.toggle('on', keepZoom);
  });
})();

function toast(msg){
  const t = el('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 2600);
}

async function loadMission(dataset, mission){
  const key = dataset + '_' + mission;
  if (cache.has(key)) return cache.get(key);
  const r = await fetch(`/data/frames/${key}.json`);
  if (!r.ok) throw new Error(`mission ${mission} not found (${r.status})`);
  const doc = await r.json();
  cache.set(key, doc);
  return doc;
}

async function open(entityId, quiet){
  const parsed = missionOf(entityId);
  if (!parsed){ toast('That does not look like a declassified entity ID.'); return; }
  const [dataset, mission] = parsed;
  const want = (entityId || '').trim().toUpperCase();

  try {
    if (!cur || cur.dataset !== dataset || cur.mission !== mission){
      el('shot-msg').textContent = `Loading mission ${mission}…`;
      cur = await loadMission(dataset, mission);
      buildFilters();
      computeVisible();
      renderList();
      miniSetMission();
    }
  } catch (e){ toast(String(e.message || e)); return; }

  const i = cur.frames.findIndex(f => f[F.ID].toUpperCase() === want);
  if (i < 0){
    toast(`${want} is not in mission ${mission}.`);
    if (!quiet && visible.length) show(visible[0]);
    return;
  }
  // Explicitly asking for a frame overrides the filters that would hide it —
  // otherwise searching an unscanned ID would silently land on a neighbour.
  if (!visible.includes(i)){
    if (!showUnscanned && !cur.frames[i][F.SCANNED]){
      showUnscanned = true; el('unsc').checked = true;
    }
    selCam.add(camKey(cur.frames[i]));
    for (const b of el('cam-chips').children)
      b.classList.toggle('on', selCam.has(b.dataset.cam));
    computeVisible(); renderList();
  }
  show(i);
}

// ── mini location map ───────────────────────────────────────────────────────
// A frame's stored point is its footprint centroid — rough, but enough to see
// where on Earth (and where in the orbit) you are. The mission's other frames
// are plotted faint for context, the current one in amber.
let mini = null, miniReady = false;
function initMini(){
  if (mini) return;
  mini = new maplibregl.Map({
    container: 'minimap', attributionControl: false,
    center: [0, 20], zoom: 0.7, dragRotate: false, pitchWithRotate: false,
    style: { version: 8, sources: {
      base: { type: 'raster', tileSize: 256,
        tiles: ['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'] },
    }, layers: [{ id: 'base', type: 'raster', source: 'base' }] },
  });
  mini.on('load', () => {
    mini.addSource('pts', { type: 'geojson', data: fc([]) });
    mini.addLayer({ id: 'pts', type: 'circle', source: 'pts',
      paint: { 'circle-radius': 2.4, 'circle-color': '#8b98a9', 'circle-opacity': 0.55 } });
    mini.addSource('cur', { type: 'geojson', data: fc([]) });
    mini.addLayer({ id: 'cur', type: 'circle', source: 'cur',
      paint: { 'circle-radius': 6, 'circle-color': '#f0b429',
               'circle-stroke-color': '#0b0e13', 'circle-stroke-width': 1.5 } });
    miniReady = true;
    miniSetMission();
    if (cur && pos >= 0) miniShow(cur.frames[pos]);
  });
}
const fc = feats => ({ type: 'FeatureCollection', features: feats });
const pt = (lon, lat) => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [lon, lat] }, properties: {} });

function miniSetMission(){
  if (!miniReady || !cur) return;
  const feats = [];
  for (const f of cur.frames) if (f[F.LAT] != null) feats.push(pt(f[F.LON], f[F.LAT]));
  mini.getSource('pts').setData(fc(feats));
}
function miniShow(f){
  if (!miniReady) return;
  if (f[F.LAT] == null){ mini.getSource('cur').setData(fc([])); return; }
  mini.getSource('cur').setData(fc([pt(f[F.LON], f[F.LAT])]));
  mini.easeTo({ center: [f[F.LON], f[F.LAT]], zoom: Math.max(mini.getZoom(), 3.2), duration: 450 });
}

// ── frame filters (camera, scanned) ─────────────────────────────────────────
// Navigation runs over `visible` — the mission's frames that pass the filters —
// not the raw list, so stepping skips what's filtered out and the strip and
// list only show what you're actually browsing. Positions stay absolute (frame
// N of the whole mission), so a filtered view doesn't renumber the frames.
let showUnscanned = false;
let selCam = new Set();          // cameras currently enabled
let visible = [];                // indices into cur.frames, ascending

const camKey = f => f[F.CAM] || '';

function buildFilters(){
  const present = [];
  const seen = new Set();
  for (const f of cur.frames){ const c = camKey(f); if (!seen.has(c)){ seen.add(c); present.push(c); } }
  present.sort();
  selCam = new Set(present);     // a fresh mission starts with every camera on

  const box = el('cam-chips');
  box.innerHTML = '';
  // Nothing to choose between if the mission flew one camera.
  box.style.display = present.length > 1 ? 'flex' : 'none';
  if (present.length > 1){
    for (const c of present){
      const b = document.createElement('button');
      b.className = 'fchip on';
      b.textContent = c || 'no camera';
      b.dataset.cam = c;
      b.addEventListener('click', () => {
        b.classList.toggle('on');
        b.classList.contains('on') ? selCam.add(c) : selCam.delete(c);
        onFilterChange();
      });
      box.appendChild(b);
    }
  }
  el('unsc').checked = showUnscanned;
}

function computeVisible(){
  visible = [];
  for (let i = 0; i < cur.frames.length; i++){
    const f = cur.frames[i];
    if (!showUnscanned && !f[F.SCANNED]) continue;
    if (!selCam.has(camKey(f))) continue;
    visible.push(i);
  }
}

function nearestVisible(i){
  if (!visible.length) return -1;
  let best = visible[0], bd = Infinity;
  for (const v of visible){
    const d = Math.abs(v - i);
    if (d < bd){ bd = d; best = v; }
    if (v > i) break;               // visible is ascending; distance only grows
  }
  return best;
}

function updateNav(){
  const vi = visible.indexOf(pos);
  el('prev').disabled = vi <= 0;
  el('next').disabled = vi < 0 || vi >= visible.length - 1;
}

// Re-run when a filter changes: if the current frame survived, just repaint;
// if it was filtered out, jump to the nearest frame that wasn't.
function onFilterChange(){
  computeVisible();
  renderList();
  if (!visible.length){
    el('prev').disabled = el('next').disabled = true;
    el('strip').innerHTML = '';
    return;
  }
  if (visible.includes(pos)){ markActive(); buildStrip(); updateNav(); }
  else show(nearestVisible(pos));
}

function show(i){
  show._seq = show._seq || 0;
  if (!cur || i < 0 || i >= cur.frames.length) return;
  pos = i;
  const f = cur.frames[i];
  const img = el('shot'), msg = el('shot-msg');
  img.classList.remove('show');
  msg.style.display = 'block';

  // The #shot element is reused across frames, so its transform persists on its
  // own. With Lock off we drop back to fit; with Lock on the zoom & position
  // carry over, which is what makes comparing consecutive frames useful.
  if (!keepZoom) resetView(); else applyView();

  if (f[F.BROWSE]){
    const seq = ++show._seq;
    msg.textContent = 'Loading browse image…';
    const full = new Image();
    full.onload = () => {
      if (seq !== show._seq) return;      // stepped away before it arrived
      img.src = full.src; img.classList.add('show'); msg.style.display = 'none';
      // A different frame can have a different aspect, so a preserved pan may
      // now be out of bounds — re-clamp against the newly laid-out image.
      if (keepZoom && view.scale > 1.001){ clampView(); applyView(); }
      prefetchVisibleNeighbours();
    };
    full.onerror = () => {
      if (seq !== show._seq) return;
      msg.textContent = 'Browse image unavailable (USGS may be down).';
    };
    full.src = browseUrl(f[F.BROWSE]);
  } else {
    img.removeAttribute('src');
    msg.textContent = 'No browse image for this frame.';
  }

  el('eid').value = f[F.ID];
  el('meta').innerHTML = [
    ['Entity ID', `<span class="v id">${f[F.ID]}</span>`],
    ['Position', `<span class="v">${(i+1).toLocaleString()} of ${cur.frames.length.toLocaleString()}</span>`],
    ['Acquired', `<span class="v">${f[F.DATE] || '—'}</span>`],
    ['Satellite', `<span class="v">${cur.satellite}</span>`],
    ['Mission', `<span class="v">${cur.mission}</span>`],
    ['Camera', `<span class="v">${f[F.CAM] || '—'}</span>`],
    ['Scanned', `<span class="v">${f[F.SCANNED] ? 'yes' : 'not scanned'}</span>`],
  ].map(([k, v]) => `<div><div class="k">${k}</div>${v}</div>`).join('');

  el('ee').href = `https://earthexplorer.usgs.gov/scene/metadata/full/${
    EE_IDS[cur.dataset] || cur.dataset}/${f[F.ID]}/`;
  const mapHref = (f[F.LAT] != null)
    ? `/tiles.html#map=9/${f[F.LAT]}/${f[F.LON]}` : '/tiles.html';
  el('onmap').href = mapHref;

  updateNav();
  markActive();
  buildStrip();
  miniShow(f);
  history.replaceState(null, '', '#' + f[F.ID]);
}

// Step within the visible set, so a camera/scanned filter is respected.
function step(d){
  if (!cur || pos < 0 || !visible.length) return;
  const vi = visible.indexOf(pos);
  if (vi < 0){ show(nearestVisible(pos)); return; }
  show(visible[Math.min(visible.length - 1, Math.max(0, vi + d))]);
}

// Warm the visible neighbours so ← and → land instantly. Only ever one either
// side: these are ~5MB each, so reading further ahead would pull tens of MB for
// frames that may never be looked at.
const warmed = new Set();
function prefetchVisibleNeighbours(){
  const vi = visible.indexOf(pos);
  if (vi < 0) return;
  for (const k of [vi + 1, vi - 1]){
    if (k < 0 || k >= visible.length) continue;
    const tail = cur.frames[visible[k]][F.BROWSE];
    if (!tail || warmed.has(tail)) continue;
    warmed.add(tail);
    const im = new Image(); im.decoding = 'async'; im.src = browseUrl(tail);
  }
}

// Filmstrip shows a window around the current frame, over the visible set —
// rendering 20,000 cells would build 20,000 nodes for one screen.
const WIN = 12;
function buildStrip(){
  const strip = el('strip');
  strip.innerHTML = '';
  const vi = visible.indexOf(pos);
  if (vi < 0) return;
  const lo = Math.max(0, vi - WIN), hi = Math.min(visible.length, vi + WIN + 1);
  for (let k = lo; k < hi; k++){
    const i = visible[k], f = cur.frames[i];
    const c = document.createElement('div');
    c.className = 'cell' + (i === pos ? ' on' : '') + (f[F.SCANNED] ? '' : ' un');
    c.title = `${f[F.ID]} · ${f[F.DATE]}`;
    c.innerHTML = `<div class="n">${i + 1}</div>` +
      `<div class="d">${(f[F.DATE] || '').slice(5)}</div>` +
      `<div class="c">${f[F.CAM] || ''}</div>`;
    c.addEventListener('click', () => show(i));
    strip.appendChild(c);
  }
  const active = strip.querySelector('.cell.on');
  if (active) active.scrollIntoView({block:'nearest', inline:'center'});
}

function renderList(){
  const total = cur.frames.length, shown = visible.length;
  const filtered = shown < total;
  el('side-title').innerHTML = `Mission ${cur.mission}` +
    `<small id="side-sub">${cur.satellite} · ` +
    (filtered ? `${shown.toLocaleString()} of ${total.toLocaleString()} frames` :
                `${total.toLocaleString()} frames`) +
    ` · ${cur.frames[0][F.DATE]} → ${cur.frames[total-1][F.DATE]}</small>`;
  el('jump-n').max = total;

  // Built as one string: 20,000 appendChild calls locked the page for seconds.
  const list = el('list');
  list.innerHTML = visible.map(i => { const f = cur.frames[i];
    return `<div class="row${f[F.SCANNED] ? '' : ' un'}" data-i="${i}">` +
      `<span class="i">${f[F.ID]}</span><span class="p">${i + 1}</span></div>`; }).join('');
  list.onclick = e => {
    const row = e.target.closest('.row');
    if (row) show(Number(row.dataset.i));
  };
}

function markActive(){
  const list = el('list');
  const was = list.querySelector('.row.on');
  if (was) was.classList.remove('on');
  const now = list.querySelector(`.row[data-i="${pos}"]`);
  if (now){ now.classList.add('on'); now.scrollIntoView({block:'nearest'}); }
}

el('go').addEventListener('click', () => open(el('eid').value));
el('eid').addEventListener('keydown', e => { if (e.key === 'Enter') open(el('eid').value); });
el('prev').addEventListener('click', () => step(-1));
el('next').addEventListener('click', () => step(1));
el('unsc').addEventListener('change', e => {
  showUnscanned = e.target.checked;
  if (cur) onFilterChange();
});
el('jump-go').addEventListener('click', () => {
  const n = Number(el('jump-n').value);
  // Snap to the nearest visible frame so a jump into a filtered-out range still
  // lands somewhere you can step from.
  if (cur && visible.length && n >= 1 && n <= cur.frames.length) show(nearestVisible(n - 1));
});
el('jump-n').addEventListener('keydown', e => { if (e.key === 'Enter') el('jump-go').click(); });

document.addEventListener('keydown', e => {
  // Not while typing in the ID box, or arrow keys would move the caret AND the frame.
  if (e.target.tagName === 'INPUT') return;
  if (!cur || !visible.length) return;
  if (e.key === 'ArrowLeft'){ e.preventDefault(); step(-1); }
  if (e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
  if (e.key === 'Home') show(visible[0]);
  if (e.key === 'End') show(visible[visible.length - 1]);
});

initMini();

// Deep link: /frames.html#D3C1214-300989A017
const initial = decodeURIComponent(location.hash.slice(1));
if (initial) { el('eid').value = initial; open(initial); }
</script>
