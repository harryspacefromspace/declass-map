name: Update Declassified Map

on:
  schedule:
    - cron: "0 5 * * *"   # Every day at 5am UTC
  workflow_dispatch:
    inputs:
      full_pull:
        description: "Datasets to pull in full, scanned + unscanned (comma separated)"
        default: "declassii"
        type: string
      pull_satellites:
        description: "Satellites to pull whole, e.g. KH-1,KH-2,KH-3,KH-4 (bounded chunks)"
        default: ""
        type: string
      fetch_budget:
        description: "Seconds allowed for all USGS fetching before falling back"
        default: "2400"
        type: string
      skip_commit:
        description: "Skip committing index.html/scenes.db — scene data still goes to R2"
        default: false
        type: boolean
      build_tiles:
        description: "Rebuild the PMTiles vector tile archive and publish it to R2"
        default: true
        type: boolean

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # Required to commit the updated files

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests staticmap Pillow geopandas shapely

      - name: Generate config.json from secrets
        run: |
          cat > config.json << 'CONFIGEOF'
          {
            "usgs": {
              "username": "${{ secrets.M2M_USERNAME }}",
              "token": "${{ secrets.M2M_TOKEN }}"
            },
            "database": "scenes.db",
            "notifications": {
              "telegram": {
                "enabled": false
              }
            }
          }
          CONFIGEOF

      # USGS scene-search is flaky and can truncate mid-response. If the monitor
      # can't finish, we still want the map rebuilt — fetch_and_build.py has its
      # own per-dataset fallback and reads whatever scenes.db already has, so a
      # monitor failure should only cost us new-scene detection, not the update.
      - name: Step 1 — Run monitoring script (updates scenes.db)
        run: python monitor.py
        continue-on-error: true
        timeout-minutes: 45

      # The scene file is no longer in the repo, so pull the last published copy
      # down first: fetch_and_build.py falls back to it per-dataset when a USGS
      # search fails. Without it a flaky USGS run would silently drop scenes.
      - name: Step 2 — Fetch previous scene data from R2 (fallback source)
        continue-on-error: true
        run: |
          aws s3 cp "s3://${R2_BUCKET}/scenes.geojson" available_scenes.geojson \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            || echo "no previous scene data in R2 yet — first run"
          ls -la available_scenes.geojson 2>/dev/null || true
        env:
          R2_BUCKET: declass-map-data
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

      - name: Step 3 — Build map from scenes.db
        run: python fetch_and_build.py
        # Generous ceiling; FETCH_BUDGET_SECONDS is what actually bounds the
        # fetching, and a full pull of all three datasets takes far longer.
        timeout-minutes: 150
        env:
          M2M_USERNAME: ${{ secrets.M2M_USERNAME }}
          M2M_TOKEN: ${{ secrets.M2M_TOKEN }}
          # On a schedule `inputs` is empty, so these fall back to the defaults
          FULL_PULL_DATASETS: ${{ inputs.full_pull || 'declassii' }}
          FETCH_BUDGET_SECONDS: ${{ inputs.fetch_budget || '2400' }}
          PULL_SATELLITES: ${{ inputs.pull_satellites || '' }}

      # Scene data goes to R2, not the repo. Committing a ~55MB file daily grew
      # .git past 590MB, and GitHub rejects anything over 100MB outright — which
      # a full unscanned pull would exceed several times over.
      - name: Step 4 — Upload scene data to R2
        run: |
          test -s available_scenes.geojson || { echo "no scene data to upload"; exit 1; }
          aws s3 cp available_scenes.geojson \
            "s3://${R2_BUCKET}/scenes.geojson" \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/json"
          echo "uploaded $(du -h available_scenes.geojson | cut -f1)"
        env:
          R2_BUCKET: declass-map-data
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Recent AWS CLI versions send checksum headers that S3-compatible
          # stores can reject. Only send them when the operation requires it.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

      # sfs-admin resolves entity IDs against this. It can't read the scene data
      # from R2 (private bucket, Worker behind Access with a same-origin check),
      # so the three fields it needs are published here instead — dictionary
      # encoded and gzipped, which is ~0.6MB rather than the 111MB full file.
      - name: Step 4d — Rebuild the compact scene index
        run: python make_scene_index.py available_scenes.geojson scene-index.json.gz

      # Overlay sites come from OSM via Overpass, which rate-limits and times
      # out under load. A failure here must not fail the run or blank the
      # overlays, so on error we keep whatever is already published in R2.
      - name: Step 4b — Refresh overlay sites from OpenStreetMap
        continue-on-error: true
        run: python fetch_overlays.py overlays.geojson

      - name: Step 4c — Upload overlay sites to R2
        if: ${{ hashFiles('overlays.geojson') != '' }}
        run: |
          aws s3 cp overlays.geojson "s3://${R2_BUCKET}/overlays.geojson" \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/json"
          echo "uploaded $(du -h overlays.geojson | cut -f1) of overlay sites"
        env:
          R2_BUCKET: declass-map-data
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

      # The map can't load a 111MB GeoJSON — the browser gives out somewhere
      # between 108k and 214k features. Vector tiles fix that by transferring
      # only the tiles in view (~175KB to open the map), so the archive can keep
      # growing without the front end caring.
      - name: Step 5 — Install tippecanoe and pmtiles
        if: ${{ inputs.build_tiles != false }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)" > /dev/null
          sudo make -C /tmp/tippecanoe install
          tippecanoe --version
          PM_URL=$(curl -sL https://api.github.com/repos/protomaps/go-pmtiles/releases/latest \
            | grep -oE '"browser_download_url": *"[^"]*Linux_x86_64\.tar\.gz"' \
            | head -1 | sed 's/.*"\(https[^"]*\)"/\1/')
          curl -sL "$PM_URL" | sudo tar xz -C /usr/local/bin pmtiles
          pmtiles version

      - name: Step 6 — Build the vector tile archive
        if: ${{ inputs.build_tiles != false }}
        run: |
          test -s available_scenes.geojson || { echo "no scene data to tile"; exit 1; }
          python make_centroids.py available_scenes.geojson centroids.geojson

          # Footprints, z5-8. Stopping at 8 is fine: these are quadrilaterals, so
          # simplification keeps all four corners and the client overzooms them
          # cleanly past that. displayId is dropped because it is identical to
          # entityId for all 213,952 features. browse is kept despite costing
          # ~40MB: corona2 and declassiii URLs are a pure function of entityId,
          # but declassii appends a frame counter that appears nowhere else, so
          # a third of the archive could not be reconstructed client-side.
          # --drop-rate=1 disables tippecanoe's default thinning. Without it it
          # drops features at every zoom below maxzoom as a matter of course —
          # 4,580 footprints vanished at z5 on the first run — which is right for
          # a basemap but wrong here, where a missing footprint means a scene the
          # archive has and the map won't show. --drop-densest-as-needed stays as
          # the bounded fallback for tiles that would otherwise blow the limit.
          tippecanoe -o footprints.mbtiles -l scenes -Z5 -z8 \
            -x displayId \
            --no-tiny-polygon-reduction \
            --drop-rate=1 \
            --drop-densest-as-needed \
            --force available_scenes.geojson

          # Counts, z0-4. tippecanoe clusters the centroids per zoom and sums the
          # tallies, which is what lets the scanned/unscanned toggle keep working
          # when there's no geometry left to draw.
          tippecanoe -o cells.mbtiles -l cells -Z0 -z4 \
            --cluster-distance=52 \
            --accumulate-attribute=n:sum \
            --accumulate-attribute=ns:sum \
            --accumulate-attribute=nu:sum \
            --force centroids.geojson

          tile-join -o combined.mbtiles --force footprints.mbtiles cells.mbtiles
          pmtiles convert combined.mbtiles scenes.pmtiles
          pmtiles show scenes.pmtiles | head -12
          ls -lh scenes.pmtiles

      - name: Step 7 — Upload vector tiles to R2
        if: ${{ inputs.build_tiles != false }}
        run: |
          test -s scenes.pmtiles || { echo "no tile archive to upload"; exit 1; }
          aws s3 cp scenes.pmtiles "s3://${R2_BUCKET}/scenes.pmtiles" \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/octet-stream"
          echo "uploaded $(du -h scenes.pmtiles | cut -f1) of tiles"
        env:
          R2_BUCKET: declass-map-data
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

      # index.html and scenes.db still belong in git — Pages deploys from the
      # repo, and scenes.db is what tracks first-seen-available dates.
      - name: Commit updated files
        if: ${{ inputs.skip_commit != true }}
        run: |
          git config user.name  "declass-map-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scenes.db index.html scene-index.json.gz
          git diff --staged --quiet || git commit -m "Daily update $(date -u +%Y-%m-%d)"
          git push
