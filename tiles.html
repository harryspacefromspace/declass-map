<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Declassified Satellite — footprint map</title>
<link href="vendor/maplibre-gl.css" rel="stylesheet">
<style>
  :root{--bg:#0b0e13;--panel:#11161ef2;--edge:#2a3441;--ink:#e6edf3;--dim:#8b98a9;
        --hi:#f0b429;--un:#a78bfa;--chip:#1a2029}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
            font:13px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  #map{position:absolute;inset:0}

  /* top bar */
  #bar{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;gap:8px;
       align-items:center;padding:9px 12px;background:linear-gradient(#0b0e13ee,#0b0e1300);
       flex-wrap:wrap}
  #brand{font-weight:600;letter-spacing:.01em;white-space:nowrap}
  #brand span{color:var(--dim);font-weight:400;margin-left:7px;font-size:11.5px}
  .ctl{background:var(--chip);border:1px solid var(--edge);color:var(--ink);
       border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
  .ctl:hover{border-color:#3d4b5c}
  .ctl.on{border-color:#f0b42955;color:var(--hi);background:#f0b4290d}
  select.ctl{cursor:pointer}
  #search{flex:1;min-width:180px;max-width:320px;cursor:text}
  .seg{display:flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden}
  .seg button{background:var(--chip);border:0;border-right:1px solid var(--edge);
              color:var(--dim);padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
  .seg button:last-child{border-right:0}
  .seg button.on{background:#1f2937;color:var(--ink)}
  .spacer{flex:1}

  /* filter panel */
  #filters{position:absolute;top:52px;left:12px;z-index:6;width:232px;
           background:var(--panel);border:1px solid var(--edge);border-radius:10px;
           padding:12px 14px;backdrop-filter:blur(8px);display:none}
  #filters.open{display:block}
  .row{display:flex;align-items:center;gap:7px;margin:6px 0}
  .row label{flex:1;cursor:pointer}
  .sw{width:11px;height:11px;border-radius:2px;flex:none}
  .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em;
       margin:12px 0 5px}
  select,input[type=range]{width:100%;background:#0b0e13;color:var(--ink);
       border:1px solid var(--edge);border-radius:6px;padding:5px;font:inherit}
  input[type=range]{padding:0}
  .yr{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
  .yr b{color:var(--hi)}
  hr{border:0;border-top:1px solid var(--edge);margin:11px 0}

  /* counter */
  #counter{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:5;
           background:var(--panel);border:1px solid var(--edge);border-radius:20px;
           padding:6px 15px;font-size:12px;color:var(--dim);white-space:nowrap}
  #counter b{color:var(--hi);font-variant-numeric:tabular-nums}

  /* sidebar */
  /* Sits below the top bar, not over it: at full height it covered the List
     button and the whole basemap switcher, which became unclickable exactly
     when the sidebar was open. */
  #sb{position:absolute;top:46px;right:0;bottom:0;width:322px;z-index:7;background:#0d1118fa;
      border-left:1px solid var(--edge);display:none;flex-direction:column}
  #sb.open{display:flex}
  #sb-head{display:flex;align-items:center;gap:10px;padding:12px 14px;
           border-bottom:1px solid var(--edge)}
  #sb-head h2{margin:0;font-size:13px;font-weight:600}
  #sb-head .sub{color:var(--dim);font-size:11px;margin-top:2px}
  #sb-close{margin-left:auto;background:0;border:0;color:var(--dim);cursor:pointer;
            font-size:16px;line-height:1}
  #sb-ctl{padding:9px 14px;border-bottom:1px solid var(--edge)}
  #sb-list{overflow-y:auto;flex:1}
  .sb-item{padding:9px 14px;border-bottom:1px solid #1a2029;cursor:pointer}
  .sb-item:hover{background:#141a23}
  .sb-item .t{font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .sb-item .m{color:var(--dim);font-size:11px;margin-top:2px}
  .sb-item .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
  #sb-more{margin:10px 14px 16px;padding:7px;width:calc(100% - 28px)}

  /* popup */
  .maplibregl-popup-content{background:#11161e;color:var(--ink);font-size:12px;
      border:1px solid var(--edge);border-radius:9px;padding:0;overflow:hidden;
      box-shadow:0 8px 28px #000a}
  .maplibregl-popup-close-button{color:var(--dim);font-size:17px;padding:2px 7px}
  .pp-img{display:block;width:100%;height:132px;object-fit:cover;background:#0b0e13;
          border-bottom:1px solid var(--edge)}
  .pp-body{padding:9px 11px}
  .pp-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
         color:var(--hi);word-break:break-all;margin-bottom:6px}
  .pp-row{display:flex;gap:8px;margin:2px 0}
  .pp-row span:first-child{color:var(--dim);min-width:74px}
  .pp-links{margin-top:8px;display:flex;gap:8px}
  .pp-links a{color:#7dd3fc;text-decoration:none;font-size:11.5px}
  .pp-links a:hover{text-decoration:underline}
  .maplibregl-popup-tip{border-top-color:#11161e!important;border-bottom-color:#11161e!important}
  #toast{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);z-index:9;
         background:#1f2937;border:1px solid var(--edge);border-radius:8px;padding:7px 13px;
         font-size:12px;display:none}
</style>
</head>
<body>
<div id="map"></div>

<div id="bar">
  <div id="brand">Declassified Satellite <span id="brand-sub">footprint map</span></div>
  <button class="ctl" id="btn-filters">Filters</button>
  <input class="ctl" id="search" placeholder="Entity ID, or lat, lon" autocomplete="off">
  <div class="spacer"></div>
  <button class="ctl" id="btn-list">List</button>
  <div class="seg" id="bm">
    <button data-bm="dark" class="on">Dark</button>
    <button data-bm="satellite">Satellite</button>
    <button data-bm="hybrid">Hybrid</button>
    <button data-bm="osm">OSM</button>
  </div>
</div>

<div id="filters">
  <div class="row"><span class="sw" style="background:#f0b429"></span>
    <label for="f-scanned">Scanned</label><input type="checkbox" id="f-scanned" checked></div>
  <div class="row"><span class="sw" style="background:#8b5cf6"></span>
    <label for="f-unscanned">Not scanned</label><input type="checkbox" id="f-unscanned" checked></div>

  <div class="lbl">Satellite</div>
  <select id="f-sat"><option value="">All</option></select>

  <div class="lbl">Acquired</div>
  <div class="yr"><b id="y-lo">1959</b><span style="color:var(--dim)">to</span><b id="y-hi">1984</b></div>
  <input type="range" id="f-y-lo" min="1959" max="1984" value="1959">
  <input type="range" id="f-y-hi" min="1959" max="1984" value="1984">

  <hr>
  <button class="ctl" id="f-reset" style="width:100%">Reset filters</button>
</div>

<div id="counter">loading…</div>
<div id="toast"></div>

<aside id="sb">
  <div id="sb-head">
    <div><h2>Scenes on map</h2><div class="sub" id="sb-sub">—</div></div>
    <button id="sb-close" title="Close">✕</button>
  </div>
  <div id="sb-ctl">
    <select id="sb-sort">
      <option value="date-desc">Newest acquired first</option>
      <option value="date-asc">Oldest acquired first</option>
      <option value="sat-asc">Satellite</option>
      <option value="mission-asc">Mission</option>
    </select>
  </div>
  <div id="sb-list"></div>
  <button class="ctl" id="sb-more">Load more</button>
</aside>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script>
const t0 = performance.now();
const SRC = location.origin + '/data/scenes.pmtiles';
const el = id => document.getElementById(id);

const DS_EE_IDS = {corona2:'5e839febdccb64b3', declassii:'5e839ff7d71d4811',
                   declassiii:'5e7c41f3ffaaf662'};
const eeUrl = p => 'https://earthexplorer.usgs.gov/scene/metadata/full/'
                 + (DS_EE_IDS[p.dataset] || p.dataset) + '/' + p.entityId + '/';

const proto = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', proto.tile);
proto.add(new pmtiles.PMTiles(SRC));

// Basemaps are all mounted at once and toggled by visibility. Swapping the
// style instead tears down the vector layers and re-requests every tile, which
// is what made the old globe's basemap switching feel broken.
const RASTER = {
  carto: ['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
          'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'],
  esri:  ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
  esriRef: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],
  osm:   ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
          'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png'],
};
const rasterSource = tiles => ({type:'raster', tiles, tileSize:256, maxzoom:19,
  attribution:'© OpenStreetMap, © CARTO, © Esri · USGS/NASA'});

const map = new maplibregl.Map({
  container:'map', center:[45,40], zoom:3, maxZoom:15, hash:true,
  style:{
    version:8,
    glyphs:'vendor/fonts/{fontstack}/{range}.pbf',
    sources:{
      bm_carto:rasterSource(RASTER.carto), bm_esri:rasterSource(RASTER.esri),
      bm_esriRef:rasterSource(RASTER.esriRef), bm_osm:rasterSource(RASTER.osm),
      scenes:{type:'vector', url:'pmtiles://'+SRC, minzoom:0, maxzoom:8},
    },
    layers:[
      {id:'bm-carto', type:'raster', source:'bm_carto', paint:{'raster-opacity':0.8}},
      {id:'bm-esri', type:'raster', source:'bm_esri',
       layout:{visibility:'none'}, paint:{'raster-opacity':0.9}},
      {id:'bm-esriRef', type:'raster', source:'bm_esriRef',
       layout:{visibility:'none'}, paint:{'raster-opacity':0.7}},
      {id:'bm-osm', type:'raster', source:'bm_osm',
       layout:{visibility:'none'}, paint:{'raster-opacity':0.85}},

      {id:'heat', type:'heatmap', source:'scenes', 'source-layer':'cells', maxzoom:5,
       paint:{
         'heatmap-weight':['interpolate',['linear'],['get','n'],0,0,400,1],
         'heatmap-intensity':['interpolate',['linear'],['zoom'],0,0.7,4,1.0],
         'heatmap-radius':['interpolate',['linear'],['zoom'],0,45,2,75,4,105],
         'heatmap-opacity':['interpolate',['linear'],['zoom'],4,0.85,5,0],
         'heatmap-color':['interpolate',['linear'],['heatmap-density'],
           0,'rgba(11,14,19,0)', 0.18,'rgba(72,52,120,0.55)', 0.40,'rgba(140,74,132,0.72)',
           0.62,'rgba(206,110,86,0.85)', 0.82,'rgba(240,180,41,0.93)', 1,'rgba(255,246,222,1)']}},
      {id:'cells', type:'circle', source:'scenes', 'source-layer':'cells', maxzoom:5,
       paint:{'circle-color':'rgba(13,17,24,0.62)', 'circle-stroke-color':'#f0b429',
              'circle-stroke-width':1.2, 'circle-radius':10,
              'circle-opacity':['interpolate',['linear'],['zoom'],4,0.92,5,0],
              'circle-stroke-opacity':['interpolate',['linear'],['zoom'],4,0.85,5,0]}},
      {id:'cells-count', type:'symbol', source:'scenes', 'source-layer':'cells', maxzoom:5,
       layout:{'text-font':['NotoSans'], 'text-field':'', 'text-padding':3,
               'text-allow-overlap':false,
               'text-size':['interpolate',['linear'],['sqrt',['get','n']],0,9.5,20,12,80,15,200,18]},
       paint:{'text-color':'#fbf1dc','text-halo-color':'rgba(9,12,17,0.85)',
              'text-halo-width':1.1,
              'text-opacity':['interpolate',['linear'],['zoom'],4,1,5,0]}},

      {id:'fill', type:'fill', source:'scenes', 'source-layer':'scenes', minzoom:5,
       paint:{'fill-color':['case',['==',['get','scanned'],false],'#8b5cf6','#f0b429'],
              'fill-opacity':['interpolate',['linear'],['zoom'],5,0.035,8,0.07,12,0.13]}},
      {id:'line', type:'line', source:'scenes', 'source-layer':'scenes', minzoom:5,
       paint:{'line-color':['case',['==',['get','scanned'],false],'#a78bfa','#f6c453'],
              'line-width':['interpolate',['linear'],['zoom'],5,0.35,9,0.7,13,1.2],
              'line-opacity':['interpolate',['linear'],['zoom'],5,0.5,9,0.8]}},
      {id:'sel', type:'line', source:'scenes', 'source-layer':'scenes', minzoom:5,
       filter:['==',['get','entityId'],'__none__'],
       paint:{'line-color':'#7dd3fc','line-width':2.2}},
    ],
  },
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:false}), 'bottom-right');
map.addControl(new maplibregl.ScaleControl({unit:'metric'}), 'bottom-right');

// ── basemaps ────────────────────────────────────────────────────────────────
const BM = {dark:['bm-carto'], satellite:['bm-esri'],
            hybrid:['bm-esri','bm-esriRef'], osm:['bm-osm']};
function setBasemap(name){
  for (const [id] of Object.entries({'bm-carto':1,'bm-esri':1,'bm-esriRef':1,'bm-osm':1}))
    map.setLayoutProperty(id, 'visibility', BM[name].includes(id) ? 'visible' : 'none');
  for (const b of document.querySelectorAll('#bm button'))
    b.classList.toggle('on', b.dataset.bm === name);
}
for (const b of document.querySelectorAll('#bm button'))
  b.addEventListener('click', () => setBasemap(b.dataset.bm));

// ── filters ─────────────────────────────────────────────────────────────────
const YMIN = 1959, YMAX = 1984;
function yearBounds(){
  let lo = Number(el('f-y-lo').value), hi = Number(el('f-y-hi').value);
  if (lo > hi) [lo, hi] = [hi, lo];        // dragging one past the other
  return [lo, hi];
}

function applyFilter(){
  const scanned = el('f-scanned').checked, unscanned = el('f-unscanned').checked;
  const sat = el('f-sat').value;
  const [lo, hi] = yearBounds();
  el('y-lo').textContent = lo; el('y-hi').textContent = hi;

  const clauses = ['all'];
  if (scanned && !unscanned)       clauses.push(['!=',['get','scanned'],false]);
  else if (!scanned && unscanned)  clauses.push(['==',['get','scanned'],false]);
  else if (!scanned && !unscanned) clauses.push(['==',['get','scanned'],'__none__']);
  if (sat) clauses.push(['==',['get','satellite'],sat]);
  if (lo > YMIN || hi < YMAX){
    // acquisitionDate is "YYYY-MM-DD …" — comparing the year substring avoids
    // parsing a date per feature per frame.
    const y = ['slice',['get','acquisitionDate'],0,4];
    if (lo > YMIN) clauses.push(['>=', y, String(lo)]);
    if (hi < YMAX) clauses.push(['<=', y, String(hi)]);
  }
  const f = clauses.length > 1 ? clauses : null;
  map.setFilter('fill', f);
  map.setFilter('line', f);

  // Count cells carry tallies, not geometry, so the scanned/unscanned toggle
  // picks which tally to draw. Satellite and year can't apply to a count that
  // was aggregated without them.
  const field = (scanned && unscanned) ? 'n' : scanned ? 'ns' : unscanned ? 'nu' : null;
  if (field){
    const v = ['get', field];
    for (const l of ['cells','cells-count','heat']) map.setFilter(l, ['>', v, 0]);
    map.setPaintProperty('cells','circle-radius',
      ['interpolate',['linear'],['sqrt',v],0,4,10,9,40,15,100,22,250,32]);
    map.setPaintProperty('heat','heatmap-weight',['interpolate',['linear'],v,0,0,400,1]);
    map.setLayoutProperty('cells-count','text-field',
      ['case',['>=',v,1000],['concat',['to-string',['round',['/',v,1000]]],'k'],['to-string',v]]);
  } else {
    for (const l of ['cells','cells-count','heat']) map.setFilter(l, ['==',['get','n'],-1]);
  }
  report();
}
for (const id of ['f-scanned','f-unscanned','f-sat','f-y-lo','f-y-hi'])
  el(id).addEventListener('input', applyFilter);

el('f-reset').addEventListener('click', () => {
  el('f-scanned').checked = el('f-unscanned').checked = true;
  el('f-sat').value = '';
  el('f-y-lo').value = YMIN; el('f-y-hi').value = YMAX;
  applyFilter();
});
el('btn-filters').addEventListener('click', () => {
  const open = el('filters').classList.toggle('open');
  el('btn-filters').classList.toggle('on', open);
});

// ── satellite list, accumulated as tiles arrive ─────────────────────────────
const satsSeen = new Set();
function fillSatellites(){
  if (map.getZoom() < 5) return;
  let added = false;
  for (const f of map.querySourceFeatures('scenes', {sourceLayer:'scenes'})){
    const s = f.properties.satellite;
    if (s && !satsSeen.has(s)){ satsSeen.add(s); added = true; }
  }
  if (!added) return;
  const sel = el('f-sat'), keep = sel.value;
  sel.innerHTML = '<option value="">All</option>';
  for (const s of [...satsSeen].sort()){
    const o = document.createElement('option'); o.value = o.textContent = s;
    sel.appendChild(o);
  }
  sel.value = keep;
}

// ── counter + sidebar ───────────────────────────────────────────────────────
let firstPaint = null;
function renderedRaw(){
  return map.getZoom() < 5 ? [] : map.queryRenderedFeatures({layers:['fill']});
}
// A footprint that spans several tiles comes back once per tile, so the raw
// query roughly doubles the count around Moscow (12,728 rows for 6,887 real
// scenes). Everything user-facing works off the deduped list.
function rendered(){
  const seen = new Set(), out = [];
  for (const f of renderedRaw()){
    const id = f.properties.entityId;
    if (seen.has(id)) continue;
    seen.add(id); out.push(f.properties);
  }
  return out;
}
function report(){
  if (!map.isStyleLoaded()) return;
  const z = map.getZoom();
  if (z < 5){
    const cells = map.queryRenderedFeatures({layers:['cells']});
    const field = el('f-scanned').checked && el('f-unscanned').checked ? 'n'
                : el('f-scanned').checked ? 'ns' : el('f-unscanned').checked ? 'nu' : null;
    const total = field ? cells.reduce((s,c) => s + (c.properties[field]||0), 0) : 0;
    el('counter').innerHTML = '<b>' + total.toLocaleString() + '</b> scenes in <b>'
      + cells.length + '</b> groups · zoom in for footprints';
  } else {
    const n = rendered().length;
    el('counter').innerHTML = '<b>' + n.toLocaleString() + '</b> footprints on screen';
  }
  if (el('sb').classList.contains('open')) renderSidebar();
}

const SB_PAGE = 60;
let sbShown = SB_PAGE;
const SB_SORTS = {
  'date-desc': (a,b) => (b.acquisitionDate||'').localeCompare(a.acquisitionDate||''),
  'date-asc':  (a,b) => (a.acquisitionDate||'').localeCompare(b.acquisitionDate||''),
  'sat-asc':   (a,b) => String(a.satellite).localeCompare(String(b.satellite)),
  'mission-asc':(a,b)=> String(a.mission).localeCompare(String(b.mission)),
};
function renderSidebar(){
  const rows = rendered();
  rows.sort(SB_SORTS[el('sb-sort').value] || SB_SORTS['date-desc']);

  el('sb-sub').textContent = map.getZoom() < 5
    ? 'zoom in to list scenes'
    : rows.length.toLocaleString() + ' on map';

  const slice = rows.slice(0, sbShown);
  el('sb-list').innerHTML = slice.map(p => {
    const un = p.scanned === false || p.scanned === 'false';
    return '<div class="sb-item" data-id="' + p.entityId + '">'
      + '<div class="t"><span class="dot" style="background:' + (un?'#a78bfa':'#f0b429') + '"></span>'
      + p.entityId + '</div>'
      + '<div class="m">' + String(p.acquisitionDate||'').slice(0,10) + ' · '
      + (p.satellite||'') + ' · mission ' + (p.mission||'—')
      + (un ? ' · not scanned' : '') + '</div></div>';
  }).join('');
  el('sb-more').style.display = rows.length > sbShown ? '' : 'none';

  for (const node of el('sb-list').children){
    node.addEventListener('click', () => {
      const p = rows.find(r => r.entityId === node.dataset.id);
      if (p) focusScene(p);
    });
  }
}
el('sb-sort').addEventListener('change', () => { sbShown = SB_PAGE; renderSidebar(); });
el('sb-more').addEventListener('click', () => { sbShown += SB_PAGE; renderSidebar(); });
el('sb-close').addEventListener('click', () => {
  el('sb').classList.remove('open'); el('btn-list').classList.remove('on');
});
el('btn-list').addEventListener('click', () => {
  const open = el('sb').classList.toggle('open');
  el('btn-list').classList.toggle('on', open);
  sbShown = SB_PAGE;
  if (open) renderSidebar();
});

// ── popups ──────────────────────────────────────────────────────────────────
function popupHtml(p){
  const un = p.scanned === false || p.scanned === 'false';
  const row = (k,v) => v ? '<div class="pp-row"><span>'+k+'</span><span>'+v+'</span></div>' : '';
  // Some browse images are several MB, so they arrive well after the popup;
  // drop the element entirely if one 404s rather than leaving a broken frame.
  return (p.browse
      ? '<img class="pp-img" src="'+p.browse+'" loading="lazy" alt=""'
        + ' onerror="this.remove()">'
      : '')
    + '<div class="pp-body"><div class="pp-id">' + p.entityId + '</div>'
    + row('Acquired', String(p.acquisitionDate||'').slice(0,10))
    + row('Satellite', p.satellite)
    + row('Mission', p.mission)
    + row('Camera', p.camera)
    + row('Status', un ? 'Not scanned' : 'Scanned')
    + row('Available', String(p.firstSeenAvailable||'').slice(0,10))
    + '<div class="pp-links"><a href="'+eeUrl(p)+'" target="_blank" rel="noopener">'
    + 'EarthExplorer ↗</a>'
    + (p.browse ? '<a href="'+p.browse+'" target="_blank" rel="noopener">Browse image ↗</a>' : '')
    + '</div></div>';
}
function showPopup(p, lngLat){
  map.setFilter('sel', ['==',['get','entityId'], p.entityId]);
  // Popup.on() does not return the popup, so this can't be one chain — doing
  // that leaves .addTo undefined and the popup never opens.
  const pop = new maplibregl.Popup({maxWidth:'292px', closeOnClick:true})
    .setLngLat(lngLat).setHTML(popupHtml(p));
  pop.on('close', () => map.setFilter('sel', ['==',['get','entityId'],'__none__']));
  pop.addTo(map);
}
map.on('click', 'fill', e => showPopup(e.features[0].properties, e.lngLat));
map.on('click', 'cells', e =>
  map.easeTo({center:e.features[0].geometry.coordinates,
              zoom:Math.min(map.getZoom()+2.5, 8), duration:700}));
for (const l of ['fill','cells','cells-count']){
  map.on('mouseenter', l, () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', l, () => map.getCanvas().style.cursor = '');
}

function focusScene(p){
  // Union every tile-clipped piece of this footprint, or the bounds would be
  // whichever fragment happened to come back first.
  const parts = renderedRaw().filter(f => f.properties.entityId === p.entityId);
  if (!parts.length) return;
  let x0=180,x1=-180,y0=90,y1=-90;
  for (const part of parts)
    for (const ring of part.geometry.coordinates)
      for (const [x,y] of ring){
        if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
      }
  map.fitBounds([[x0,y0],[x1,y1]], {padding:180, maxZoom:11, duration:700});
  map.once('moveend', () => showPopup(p, [(x0+x1)/2,(y0+y1)/2]));
}

// ── search ──────────────────────────────────────────────────────────────────
function toast(msg){
  const t = el('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display='none', 3600);
}
el('search').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = el('search').value.trim();
  if (!q) return;

  const coord = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (coord){
    const lat = parseFloat(coord[1]), lon = parseFloat(coord[2]);
    if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180){
      map.flyTo({center:[lon,lat], zoom:Math.max(map.getZoom(), 9), duration:900});
      return;
    }
    toast('Coordinates out of range'); return;
  }

  // Entity IDs can only be matched against what's currently loaded — the tiles
  // in view are all the client has. Say so rather than implying "no such scene".
  const needle = q.toUpperCase();
  const loaded = rendered();
  const hit = loaded.find(p => String(p.entityId).toUpperCase() === needle)
           || loaded.find(p => String(p.entityId).toUpperCase().includes(needle));
  if (hit) focusScene(hit);
  else toast(map.getZoom() < 5
    ? 'Zoom in to search scene IDs'
    : 'Not among the scenes currently loaded');
});

// ── lifecycle ───────────────────────────────────────────────────────────────
map.on('load', () => {
  firstPaint = Math.round(performance.now() - t0);
  el('brand-sub').textContent = 'footprint map · ' + firstPaint + ' ms';
  applyFilter(); fillSatellites(); report();
});
map.on('idle', () => { fillSatellites(); report(); });
map.on('moveend', () => { sbShown = SB_PAGE; report(); });
</script>
</body>
